apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syncthing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: syncthing
  sources:
    # Namespace, secrets and Traefik routes that live alongside the chart.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      path: apps/syncthing/prod/syncthing
  syncPolicy:
    syncOptions:
      # Apply server-side: several charts here ship CRDs too large for the
      # client-side last-applied-configuration annotation.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
