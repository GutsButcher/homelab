apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  sources:
    # Namespace, secrets and Traefik routes that live alongside the chart.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      path: infrastructure/metallb
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.15.2
      helm:
        releaseName: metallb
  syncPolicy:
    syncOptions:
      # Apply server-side: several charts here ship CRDs too large for the
      # client-side last-applied-configuration annotation.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
