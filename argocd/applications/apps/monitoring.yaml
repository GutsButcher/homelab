apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    # Git repo referenced only so the Helm source below can read $values/.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      ref: values
    # Namespace, secrets and Traefik routes that live alongside the chart.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      path: apps/monitoring/prod/prometheus
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.5.3
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/apps/monitoring/values.yaml
        # CRDs are managed again (skipCrds was needed only while this app was pinned to
        # chart 45.x, whose v0.65-era CRDs were older than the v0.83.0 CRDs someone had
        # applied out-of-band). Chart 88.5.3 ships operator v0.93.1 CRDs, so the chart is
        # now ahead of the cluster and applying them is an upgrade, not a downgrade.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Required for the very large CRDs shipped by cert-manager and
      # kube-prometheus-stack, which overflow the client-side apply annotation.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    # caBundle is injected at runtime by the operator / admission patch job.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
