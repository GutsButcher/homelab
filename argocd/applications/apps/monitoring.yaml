apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    # Git repo referenced only so the Helm source below can read $values/.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      ref: values
    # Namespace, secrets and Traefik routes that live alongside the chart.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      path: apps/monitoring/prod/prometheus
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 45.31.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/apps/monitoring/values.yaml
        # The prometheus-operator CRDs in this cluster were installed out-of-band and
        # are from operator v0.83.0, while this chart bundles the v0.65-era CRDs that
        # match the running operator image. Letting Argo CD manage them would mean
        # continuously trying to downgrade CRDs underneath live Prometheus and
        # ServiceMonitor objects. CRDs stay out-of-band; the chart only owns workloads.
        skipCrds: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Required for the very large CRDs shipped by cert-manager and
      # kube-prometheus-stack, which overflow the client-side apply annotation.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    # caBundle is injected at runtime by the operator / admission patch job.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
