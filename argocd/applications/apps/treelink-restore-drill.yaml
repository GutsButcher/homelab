apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: treelink-restore-drill
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: treelink
  sources:
    # Temporary: scratch recovery cluster for the backup/restore drill.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      path: apps/treelink-restore-drill
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
