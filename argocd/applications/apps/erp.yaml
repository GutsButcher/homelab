apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: erp
  sources:
    # ERPNext v16 with the van_sales and fleet apps. The image tag in
    # apps/erp/prod/kustomization.yaml is rewritten by the erp repository's CI
    # on every push to main; this Application is what turns that commit into a
    # rollout.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      path: apps/erp/prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      # The namespace is in the manifests at sync-wave -3, but ordering on a
      # very first sync is not guaranteed without this.
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    # erp-db is minted inside the cluster by the wave -1 bootstrap Job and is
    # deliberately absent from git. Without this, ArgoCD would see a Secret it
    # does not manage and report the application permanently OutOfSync.
    - group: ""
      kind: Secret
      name: erp-db
      jsonPointers:
        - /data
    # The API server defaults volumeMode, creationTimestamp and a status block
    # into each volumeClaimTemplate. None of them are in the manifest, so ArgoCD
    # sees a diff on every comparison — and volumeClaimTemplates is IMMUTABLE on
    # a StatefulSet, so selfHeal cannot ever close it. Left alone this spins:
    # the application sat OutOfSync through 91 consecutive auto-heal attempts
    # that all "succeeded" and changed nothing.
    - group: apps
      kind: StatefulSet
      name: erp-db
      jsonPointers:
        - /spec/volumeClaimTemplates
