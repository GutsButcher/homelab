apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hupo-chat-preflight
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: hupo-chat-preflight
  sources:
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: 89fb9c71a05340452b508361156cc18b5ef91d5e
      path: apps/hupo-chat-preflight/prod
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: 89fb9c71a05340452b508361156cc18b5ef91d5e
      path: apps/hupo-chat-preflight/cert-reader-access
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
