apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hupo-chat-preflight
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: hupo-chat-preflight
  sources:
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: f867b669ab58e98a9b9a8583072296988b5ea1a2
      path: apps/hupo-chat-preflight/prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
