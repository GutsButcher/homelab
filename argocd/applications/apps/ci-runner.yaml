apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ci-runner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: ci-runner
  sources:
    # Plain manifests: namespace, ServiceAccount, PVC, SealedSecret (placeholder RUNNER_TOKEN),
    # entrypoint ConfigMap, NetworkPolicy, Deployment (runner + privileged dind sidecar). Merging
    # this PR deploys it — Argo CD auto-syncs main. See apps/ci-runner/README.md.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      path: apps/ci-runner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
