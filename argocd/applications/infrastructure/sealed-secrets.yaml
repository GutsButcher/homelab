apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  sources:
    # Git repo referenced only so the Helm source below can read $values/.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      ref: values
    # Namespace, secrets and Traefik routes that live alongside the chart.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      path: infrastructure/sealed-secrets
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.16.2
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/infrastructure/sealed-secrets/values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Apply server-side: several charts here ship CRDs too large for the
      # client-side last-applied-configuration annotation.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
