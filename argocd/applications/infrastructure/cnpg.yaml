apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  sources:
    # Namespace object that the chart's resources land in.
    - repoURL: https://github.com/GutsButcher/homelab.git
      targetRevision: main
      path: infrastructure/cnpg
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.24.0
      helm:
        releaseName: cnpg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Required for the very large CRDs shipped by cert-manager and
      # kube-prometheus-stack, which overflow the client-side apply annotation.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    # caBundle is injected at runtime by the operator / admission patch job.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
