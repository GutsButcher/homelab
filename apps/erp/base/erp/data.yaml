# Data services for ERPNext.
#
# MariaDB lives here rather than in CNPG for two reasons: spec rule 7 says
# explicitly not to use the CNPG operator, and CNPG is PostgreSQL — ERPNext v16
# on this stack runs on MariaDB. A StatefulSet with its own PVC is the correct
# shape for a database that must keep its identity across restarts.
---
apiVersion: v1
kind: Service
metadata:
  name: erp-db
  namespace: erp
  labels:
    app.kubernetes.io/name: erp-db
    app.kubernetes.io/component: database
spec:
  # Headless: a StatefulSet's pods need stable per-pod DNS, and nothing should
  # ever load-balance across database replicas.
  clusterIP: None
  selector:
    app.kubernetes.io/name: erp-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erp-db
  namespace: erp
  labels:
    app.kubernetes.io/name: erp-db
    app.kubernetes.io/component: database
spec:
  serviceName: erp-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp-db
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mariadb
          image: mariadb:11.8
          args:
            # Frappe requires all three. Without the utf8mb4 pair, site
            # creation fails on index length with an error that blames the
            # schema rather than the server defaults.
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --skip-character-set-client-handshake
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-db
                  key: root-password
          ports:
            - name: mysql
              containerPort: 3306
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -uroot -p$MARIADB_ROOT_PASSWORD"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              # A real query, not `ping`: ping succeeds while the server is
              # still rejecting connections during initialisation.
              command: ["sh", "-c", "mariadb -uroot -p$MARIADB_ROOT_PASSWORD -e 'SELECT 1'"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: erp-redis-cache
  namespace: erp
  labels:
    app.kubernetes.io/name: erp-redis-cache
spec:
  selector:
    app.kubernetes.io/name: erp-redis-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-redis-cache
  namespace: erp
  labels:
    app.kubernetes.io/name: erp-redis-cache
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp-redis-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp-redis-cache
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # The cache MAY evict — that is its job under pressure.
          args: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 320Mi
---
apiVersion: v1
kind: Service
metadata:
  name: erp-redis-queue
  namespace: erp
  labels:
    app.kubernetes.io/name: erp-redis-queue
spec:
  selector:
    app.kubernetes.io/name: erp-redis-queue
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-redis-queue
  namespace: erp
  labels:
    app.kubernetes.io/name: erp-redis-queue
    app.kubernetes.io/component: queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp-redis-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp-redis-queue
        app.kubernetes.io/component: queue
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # The QUEUE must not evict: an evicted key is a background job that
          # silently never runs. Persistence on, no maxmemory policy.
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: erp-redis-queue
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: erp-redis-queue
  namespace: erp
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
