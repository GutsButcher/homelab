# Database credentials.
#
# NOT committed with a real value. This file exists so `kustomize build`
# renders a complete manifest set and so the required key is documented in the
# repo — the actual password is created once, out of band, against the live
# cluster:
#
#   kubectl -n erp create secret generic erp-db \
#     --from-literal=root-password="$(openssl rand -base64 24)"
#
# ArgoCD is configured to ignore differences on this resource's data (see the
# Application manifest), so reconciliation will not overwrite the real secret
# with this placeholder.
#
# If the homelab later adopts sealed-secrets or external-secrets, this file is
# the single place to swap — nothing else references the password directly.
apiVersion: v1
kind: Secret
metadata:
  name: erp-db
  namespace: erp
  annotations:
    kubernetes.io/description: >-
      MariaDB root password. Replace out of band; never commit a real value.
type: Opaque
stringData:
  # Placeholder. A cluster running with this value is misconfigured, and it is
  # deliberately obvious rather than a plausible-looking random string.
  root-password: "REPLACE_ME_BEFORE_FIRST_BOOT"
