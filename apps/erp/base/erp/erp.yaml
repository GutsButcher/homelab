# The ERPNext application itself: web, background workers, scheduler and the
# realtime socket server.
#
# All four run the SAME image with different commands. That is deliberate —
# a worker executing different code from the web process is a class of bug
# that only shows up as jobs failing in ways the UI cannot reproduce.
---
apiVersion: v1
kind: Service
metadata:
  name: erp
  namespace: erp
  labels:
    app.kubernetes.io/name: erp
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: erp
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: socketio
      port: 9000
      targetPort: socketio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp
  namespace: erp
  annotations:
    # After erp-site-bootstrap (wave 1). Without a site in the volume this
    # pod serves 404 to its own startupProbe and never becomes healthy.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: erp
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp
      app.kubernetes.io/component: web
  strategy:
    # Recreate, not RollingUpdate: the sites volume is ReadWriteOnce, so a
    # second pod cannot mount it while the first still holds it — a rolling
    # update would deadlock waiting for a volume that never detaches.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp
        app.kubernetes.io/component: web
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # Frappe refuses to start against a database that is not yet accepting
        # connections, and a CrashLoopBackOff at boot looks like a broken image
        # rather than a slow dependency.
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z erp-db 3306; do
                echo "waiting for erp-db:3306"
                sleep 3
              done
              echo "database reachable"
      containers:
        - name: erp
          image: gwynbliedd/erpnext-van-sales:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: erp-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-db
                  key: root-password
          ports:
            # Not named `http`: that name belongs to nginx below, which is what
            # the Service actually targets. gunicorn is an upstream here, not
            # the thing clients talk to.
            - name: gunicorn
              containerPort: 8000
          startupProbe:
            # ERPNext takes well over a minute to become useful on first boot.
            # Without a startupProbe the liveness probe kills it mid-migration,
            # forever.
            httpGet:
              path: /api/method/ping
              port: gunicorn
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/method/ping
              port: gunicorn
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/method/ping
              port: gunicorn
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites

        # The realtime server. Frappe's desk opens a socket.io connection on
        # every page load; without this the browser retries it forever and
        # notifications, background-job progress bars and list refreshes never
        # arrive. The Service and the IngressRoute have always routed port 9000
        # here — nothing was listening on it.
        - name: socketio
          image: gwynbliedd/erpnext-van-sales:latest
          imagePullPolicy: IfNotPresent
          workingDir: /home/frappe/frappe-bench
          command: ["node", "apps/frappe/socketio.js"]
          envFrom:
            - configMapRef:
                name: erp-config
          ports:
            - name: socketio
              containerPort: 9000
          # Reads redis_socketio out of sites/common_site_config.json, which is
          # written by the site-bootstrap Job.
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

        # nginx is not optional decoration — gunicorn does not serve static
        # files at all. Frappe builds its CSS/JS into sites/assets and expects
        # a web server in front to hand them out; with gunicorn alone every
        # /assets/... request 404s and the desk renders as unstyled HTML with
        # "$ is not defined" in the console. /files (user attachments) comes
        # from the same place.
        #
        # The image already ships the server, the config template and the
        # entrypoint that renders one into the other — this deployment simply
        # never ran it.
        - name: nginx
          image: gwynbliedd/erpnext-van-sales:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/nginx-entrypoint.sh"]
          envFrom:
            # Supplies FRAPPE_SITE_NAME_HEADER, which the template uses both as
            # server_name and as the site directory to try_files into.
            - configMapRef:
                name: erp-config
          env:
            # Same pod, so both upstreams are on loopback.
            - name: BACKEND
              value: 127.0.0.1:8000
            - name: SOCKETIO
              value: 127.0.0.1:9000
            # Traefik is the only thing that ever talks to this container, and
            # it sits inside the pod network.
            - name: UPSTREAM_REAL_IP_ADDRESS
              value: 10.42.0.0/16
          ports:
            # The name the Service targets.
            - name: http
              containerPort: 8080
          readinessProbe:
            # Through nginx, so this fails if either nginx or its upstream is
            # unhealthy. No Host header needed: nginx sets X-Frappe-Site-Name
            # on the proxied request itself.
            httpGet:
              path: /api/method/ping
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # root points at this directory; /assets resolves inside it.
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: erp-sites
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: erp-sites
  namespace: erp
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-queue-short
  namespace: erp
  annotations:
    # After erp-site-bootstrap (wave 1): `bench worker` reads sites/apps.txt
    # at startup and aborts if it is missing.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: erp
    app.kubernetes.io/component: queue-short
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp
      app.kubernetes.io/component: queue-short
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp
        app.kubernetes.io/component: queue-short
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: worker
          image: gwynbliedd/erpnext-van-sales:latest
          imagePullPolicy: IfNotPresent
          command: ["bench", "worker", "--queue", "short,default"]
          envFrom:
            - configMapRef:
                name: erp-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-db
                  key: root-password
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: erp-sites
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-queue-long
  namespace: erp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: erp
    app.kubernetes.io/component: queue-long
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp
      app.kubernetes.io/component: queue-long
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp
        app.kubernetes.io/component: queue-long
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: worker
          image: gwynbliedd/erpnext-van-sales:latest
          imagePullPolicy: IfNotPresent
          command: ["bench", "worker", "--queue", "long"]
          envFrom:
            - configMapRef:
                name: erp-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-db
                  key: root-password
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: erp-sites
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-scheduler
  namespace: erp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: erp
    app.kubernetes.io/component: scheduler
spec:
  # Exactly one. Two schedulers double every cron job, which for this system
  # means duplicate contract-expiry alerts and double-posted scheduled work.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: erp
      app.kubernetes.io/component: scheduler
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp
        app.kubernetes.io/component: scheduler
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: scheduler
          image: gwynbliedd/erpnext-van-sales:latest
          imagePullPolicy: IfNotPresent
          command: ["bench", "schedule"]
          envFrom:
            - configMapRef:
                name: erp-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-db
                  key: root-password
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: erp-sites
