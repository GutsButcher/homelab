# Database password bootstrap.
#
# The problem this solves: MariaDB needs a stable root password that survives
# restarts, the password must NOT live in git, and sealing one with kubeseal
# requires cluster access that the build machine does not have.
#
# The answer is to let the cluster mint its own. This Job generates a random
# password and creates the Secret in-cluster on first sync. Nothing secret ever
# enters the repository, and no human has to run anything — adding these files
# to homelab is genuinely sufficient.
#
# Ordering is by sync-wave, not by hope:
#   -2  the identity the Job runs as
#   -1  the Job itself
#    0  everything else, including MariaDB, which needs the Secret to exist
#
# ArgoCD waits for each wave to become healthy before starting the next.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erp-db-bootstrap
  namespace: erp
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: erp-db-bootstrap
  namespace: erp
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  # Deliberately minimal: create a secret, and read back the one it manages.
  # No delete and no update — a bug in this Job must not be able to rotate a
  # live database password and lock the cluster out of its own data.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["erp-db", "erp-admin"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: erp-db-bootstrap
  namespace: erp
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: erp-db-bootstrap
subjects:
  - kind: ServiceAccount
    name: erp-db-bootstrap
    namespace: erp
---
apiVersion: batch/v1
kind: Job
metadata:
  name: erp-db-bootstrap
  namespace: erp
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Re-created on each sync so the check runs again after a namespace wipe.
    # It is a no-op whenever the secret already exists.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erp-db-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: erp-db-bootstrap
      securityContext:
        # alpine/k8s runs as root by default. Nothing here needs it: the Job
        # talks to the API server over the network and writes no files.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: bootstrap
          # NOT bitnami/kubectl — Bitnami retired every numbered tag on Docker
          # Hub (only `latest` survives), so `bitnami/kubectl:1.31` fails with
          # ImagePullBackOff. The Job never runs, the secret is never created,
          # MariaDB never starts, and the whole application serves 503 with
          # nothing in the logs to explain why.
          #
          # bitnamilegacy still publishes the numbered tags, ships a shell, and
          # already runs as uid 1001. (rancher/kubectl has kubectl but no shell
          # at all, so this script could not run there.)
          image: bitnamilegacy/kubectl:1.31
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # /dev/urandom rather than $RANDOM: the latter is seeded from the
              # pid and clock, which in a container starting at a predictable
              # moment is not a secret at all.
              #
              # Alphanumeric only. MariaDB's root password travels through
              # shell invocations in the entrypoint and in probes, and a quote
              # or a $ in it turns a healthy database into an authentication
              # failure nobody can debug without reading the password aloud.
              mint() {
                tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32
              }

              # DANGER — erp-db must outlive every re-sync.
              #
              # MariaDB reads MARIADB_ROOT_PASSWORD exactly once, when it
              # initialises an EMPTY datadir. If this Secret is ever deleted
              # while the erp-db PVC survives, the next run of this Job mints a
              # password the database will never adopt, and the two are divorced
              # permanently: MariaDB keeps the old password on disk, every
              # client gets the new one, and the whole namespace fails with
              # "Access denied for user 'root'". The Role below has no `update`
              # verb precisely so a bug here cannot rotate a live password — but
              # nothing can stop a manual `kubectl delete secret erp-db`.
              #
              # If that happens, recovery is either ALTER USER on the running
              # database to match the new Secret, or deleting the erp-db PVC to
              # let MariaDB re-initialise (which destroys all data).
              if kubectl -n erp get secret erp-db >/dev/null 2>&1; then
                echo "erp-db already exists — leaving it alone"
              else
                echo "minting a new database password"
                kubectl -n erp create secret generic erp-db \
                  --from-literal=root-password="$(mint)"
                echo "erp-db created"
              fi

              # The ERPNext Administrator password. Read it with:
              #   kubectl -n erp get secret erp-admin \
              #     -o jsonpath='{.data.admin-password}' | base64 -d
              #
              # Unlike erp-db this one is safe to lose: it is only consumed at
              # site creation, and afterwards `bench set-admin-password` is the
              # way to change it.
              if kubectl -n erp get secret erp-admin >/dev/null 2>&1; then
                echo "erp-admin already exists — leaving it alone"
              else
                echo "minting a new admin password"
                kubectl -n erp create secret generic erp-admin \
                  --from-literal=admin-password="$(mint)"
                echo "erp-admin created"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
