# Object store data. local-path on node01, deliberately NOT the node that runs
# treelink-db (gwynbliedd) so database backups survive the loss of that node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  annotations:
    # Keep data when the Application is deleted/disabled (see argocd/README.md).
    argocd.argoproj.io/sync-options: Delete=false
  namespace: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
