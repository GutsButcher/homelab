# Creates the buckets consumers expect. Idempotent; Argo re-runs it on every sync
# as a PostSync hook. (treelink-db was also auto-created by the first backup.)
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-buckets
  namespace: rustfs
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          image: amazon/aws-cli:2.37.3
          command:
            - sh
            - -c
            - |
              set -e
              export AWS_EC2_METADATA_DISABLED=true
              for b in treelink-db; do
                aws --endpoint-url "$S3_ENDPOINT" s3api head-bucket --bucket "$b" 2>/dev/null \
                  || aws --endpoint-url "$S3_ENDPOINT" s3api create-bucket --bucket "$b"
              done
              aws --endpoint-url "$S3_ENDPOINT" s3 ls
          env:
            - name: S3_ENDPOINT
              value: http://rustfs.rustfs.svc.cluster.local:9000
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: RUSTFS_SECRET_KEY
