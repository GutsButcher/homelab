# Sealed REAL registration token (2026-10-03, valid 1 h from minting; only needed for the first
# registration — the entrypoint persists .runner/.credentials on the PVC afterwards).
# Sealed with `kubeseal --cert=<fetched controller cert>` against this cluster's sealed-secrets
# controller (strict scope: only unseals as Secret ci-runner-registration in namespace
# ci-runner). Before the runner can register, the owner must generate a real token and reseal
# this file — see apps/ci-runner/README.md, "Owner steps: first registration". The token expires
# in 1 hour; it is only needed once because the entrypoint persists .runner/.credentials on the
# PVC after the first successful registration.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ci-runner-registration
  namespace: ci-runner
spec:
  encryptedData:
    RUNNER_TOKEN: 
  template:
    metadata:
      name: ci-runner-registration
      namespace: ci-runner
    type: Opaque
