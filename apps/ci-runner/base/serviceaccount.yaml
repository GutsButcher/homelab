# Dedicated identity for the runner pod. Deliberately carries no Role/RoleBinding: the pod
# never talks to the Kubernetes API (it registers with GitHub over the internet, not the
# cluster), so it gets no permissions at all rather than the namespace default SA's implicit
# ones. automountServiceAccountToken is also set on the pod spec as a second, redundant guard.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-runner
  namespace: ci-runner
automountServiceAccountToken: false
