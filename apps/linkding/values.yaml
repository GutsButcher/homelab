common:
  # env variables
  variables:
    secret: {}
    nonSecret:
      USER_UID: '1000'
      USER_GID: '1000'
      TZ: Asia/Bahrain
      LD_ALLOWED_HOSTS: "linkding.gwynbliedd.com,localhost,127.0.0.1"
      LD_CSRF_TRUSTED_ORIGINS: "https://linkding.gwynbliedd.com"
      LD_REQUEST_TIMEOUT: "60"
      LD_TESTO: "TEST"
  persistence:
    enabled: true
    volumes:
      - name: "data"
        size: "5Gi"
        # PVC is declared in prod/linkding/pvc.yaml (the chart cannot annotate it).
        pvcClaim: "linkding-data"
        containerMount: "/etc/linkding/data"
