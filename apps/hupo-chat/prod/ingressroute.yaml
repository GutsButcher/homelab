{
  "apiVersion": "traefik.io/v1alpha1",
  "kind": "IngressRoute",
  "metadata": {
    "name": "hupo-chat",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "10"
    }
  },
  "spec": {
    "entryPoints": [
      "web"
    ],
    "routes": [
      {
        "match": "Host(`chat.gwynbliedd.com`)",
        "kind": "Rule",
        "services": [
          {
            "name": "hupo-chat-web",
            "port": 3000
          }
        ]
      }
    ]
  }
}
