{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "hupo-chat-web",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "0"
    }
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "revisionHistoryLimit": 2,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "hupo-chat",
        "app.kubernetes.io/part-of": "hupo-chat",
        "app.kubernetes.io/component": "web"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "hupo-chat",
          "app.kubernetes.io/part-of": "hupo-chat",
          "app.kubernetes.io/component": "web"
        },
        "annotations": {
          "hupo.chat/runtime-revision": "v4.19.1-ce-1"
        }
      },
      "spec": {
        "serviceAccountName": "hupo-chat",
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "fsGroup": 1000,
          "fsGroupChangePolicy": "OnRootMismatch",
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "terminationGracePeriodSeconds": 40,
        "containers": [
          {
            "name": "chatwoot",
            "image": "chatwoot/chatwoot:v4.19.1-ce@sha256:04895c7bd0550d9e74b45b7202787b56f7ee4e891ebbde0c429c8c32901b97cf",
            "imagePullPolicy": "IfNotPresent",
            "command": [
              "ruby",
              "/opt/hupo-chat/entrypoint.rb"
            ],
            "workingDir": "/app",
            "envFrom": [
              {
                "configMapRef": {
                  "name": "hupo-chat-config"
                }
              },
              {
                "secretRef": {
                  "name": "hupo-chat-secrets"
                }
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "runtime",
                "mountPath": "/opt/hupo-chat",
                "readOnly": true
              },
              {
                "name": "uploads",
                "mountPath": "/app/storage"
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "rails-tmp",
                "mountPath": "/app/tmp"
              },
              {
                "name": "log",
                "mountPath": "/app/log"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "250m",
                "memory": "768Mi"
              },
              "limits": {
                "cpu": "2",
                "memory": "2Gi"
              }
            },
            "args": [
              "bundle",
              "exec",
              "rails",
              "s",
              "-p",
              "3000",
              "-b",
              "0.0.0.0"
            ],
            "ports": [
              {
                "name": "http",
                "containerPort": 3000
              }
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/health",
                "port": 3000
              },
              "timeoutSeconds": 5,
              "periodSeconds": 10,
              "failureThreshold": 60
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 3000
              },
              "timeoutSeconds": 5,
              "periodSeconds": 20,
              "failureThreshold": 5
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "ruby",
                  "/opt/hupo-chat/healthcheck.rb",
                  "3000",
                  "/api"
                ]
              },
              "timeoutSeconds": 5,
              "periodSeconds": 15,
              "failureThreshold": 3
            }
          }
        ],
        "volumes": [
          {
            "name": "runtime",
            "configMap": {
              "name": "hupo-chat-runtime",
              "defaultMode": 292
            }
          },
          {
            "name": "uploads",
            "persistentVolumeClaim": {
              "claimName": "hupo-chat-uploads"
            }
          },
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "256Mi"
            }
          },
          {
            "name": "rails-tmp",
            "emptyDir": {
              "sizeLimit": "256Mi"
            }
          },
          {
            "name": "log",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          }
        ]
      }
    }
  }
}
