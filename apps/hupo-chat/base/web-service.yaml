{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "hupo-chat-web",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "0"
    }
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app.kubernetes.io/name": "hupo-chat",
      "app.kubernetes.io/part-of": "hupo-chat",
      "app.kubernetes.io/component": "web"
    },
    "ports": [
      {
        "name": "http",
        "port": 3000,
        "targetPort": 3000
      }
    ]
  }
}
