{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "hupo-chat-uploads",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "0",
      "argocd.argoproj.io/sync-options": "Delete=false"
    }
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "resources": {
      "requests": {
        "storage": "20Gi"
      }
    }
  }
}
