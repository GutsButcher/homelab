{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "hupo-chat-postgres",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-20"
    }
  },
  "spec": {
    "serviceName": "hupo-chat-postgres",
    "replicas": 1,
    "persistentVolumeClaimRetentionPolicy": {"whenDeleted": "Retain", "whenScaled": "Retain"},
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "hupo-chat",
        "app.kubernetes.io/part-of": "hupo-chat",
        "app.kubernetes.io/component": "postgres"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "hupo-chat",
          "app.kubernetes.io/part-of": "hupo-chat",
          "app.kubernetes.io/component": "postgres"
        }
      },
      "spec": {
        "nodeSelector": {"kubernetes.io/hostname": "node01"},
        "serviceAccountName": "hupo-chat",
        "automountServiceAccountToken": false,
        "terminationGracePeriodSeconds": 60,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 999,
          "runAsGroup": 999,
          "fsGroup": 999,
          "fsGroupChangePolicy": "OnRootMismatch",
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "postgres",
            "image": "pgvector/pgvector:0.8.2-pg16-bookworm@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc",
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "env": [
              {
                "name": "POSTGRES_DB",
                "value": "hupo_chat"
              },
              {
                "name": "POSTGRES_USER",
                "value": "hupo_chat"
              },
              {
                "name": "PGDATA",
                "value": "/var/lib/postgresql/data/pgdata"
              },
              {
                "name": "POSTGRES_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "hupo-chat-secrets",
                    "key": "POSTGRES_PASSWORD"
                  }
                }
              }
            ],
            "ports": [
              {
                "name": "postgres",
                "containerPort": 5432
              }
            ],
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/postgresql/data"
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "socket",
                "mountPath": "/var/run/postgresql"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "250m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "1Gi"
              }
            },
            "startupProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-ec",
                  "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                ]
              },
              "timeoutSeconds": 5,
              "periodSeconds": 10,
              "failureThreshold": 30
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-ec",
                  "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                ]
              },
              "timeoutSeconds": 5,
              "periodSeconds": 10,
              "failureThreshold": 3
            },
            "livenessProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-ec",
                  "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                ]
              },
              "timeoutSeconds": 5,
              "periodSeconds": 10,
              "failureThreshold": 6
            }
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          },
          {
            "name": "socket",
            "emptyDir": {
              "sizeLimit": "16Mi"
            }
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data",
          "annotations": {
            "argocd.argoproj.io/sync-options": "Prune=false,Delete=false"
          }
        },
        "spec": {
          "storageClassName": "local-path",
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "20Gi"
            }
          }
        }
      }
    ]
  }
}
