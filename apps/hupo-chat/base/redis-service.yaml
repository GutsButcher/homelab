{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "hupo-chat-redis",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-20"
    }
  },
  "spec": {
    "type": "ClusterIP",
    "ports": [
      {
        "name": "redis",
        "port": 6379,
        "targetPort": 6379
      }
    ],
    "selector": {
      "app.kubernetes.io/name": "hupo-chat",
      "app.kubernetes.io/part-of": "hupo-chat",
      "app.kubernetes.io/component": "redis"
    }
  }
}
