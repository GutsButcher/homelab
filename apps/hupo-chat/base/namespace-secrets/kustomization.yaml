{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "hupo-chat",
  "resources": [
    "service-account.yaml",
    "role.yaml",
    "role-binding.yaml",
    "network-dns.yaml",
    "network-api.yaml",
    "job.yaml"
  ],
  "configMapGenerator": [
    {
      "name": "hupo-chat-namespace-secrets-code",
      "files": ["generate.rb", "secret_policy.rb", "kubernetes_api.rb"]
    }
  ],
  "generatorOptions": {
    "disableNameSuffixHash": false,
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-38"
    }
  }
}
