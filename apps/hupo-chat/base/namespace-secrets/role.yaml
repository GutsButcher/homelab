{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "Role",
  "metadata": {
    "name": "hupo-chat-namespace-secrets",
    "namespace": "hupo-chat",
    "annotations": {"argocd.argoproj.io/sync-wave": "-38"}
  },
  "rules": [
    {"apiGroups": [""], "resources": ["secrets"], "verbs": ["create"]},
    {
      "apiGroups": [""], "resources": ["secrets"], "verbs": ["get"],
      "resourceNames": ["hupo-chat-secrets", "hupo-chat-owner-bootstrap"]
    },
    {
      "apiGroups": [""], "resources": ["persistentvolumeclaims"], "verbs": ["get"],
      "resourceNames": ["data-hupo-chat-postgres-0", "data-hupo-chat-redis-0", "hupo-chat-uploads"]
    }
  ]
}
