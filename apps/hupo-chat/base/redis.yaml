{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "hupo-chat-redis",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-20"
    }
  },
  "spec": {
    "serviceName": "hupo-chat-redis",
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "hupo-chat",
        "app.kubernetes.io/part-of": "hupo-chat",
        "app.kubernetes.io/component": "redis"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "hupo-chat",
          "app.kubernetes.io/part-of": "hupo-chat",
          "app.kubernetes.io/component": "redis"
        }
      },
      "spec": {
        "serviceAccountName": "hupo-chat",
        "automountServiceAccountToken": false,
        "terminationGracePeriodSeconds": 60,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 999,
          "runAsGroup": 999,
          "fsGroup": 999,
          "fsGroupChangePolicy": "OnRootMismatch",
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "redis",
            "image": "redis:7.4.7-bookworm@sha256:976ab0f0939b78c06d802bcd3bea44c5142ea9a756a57b861e08819817f768c8",
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "env": [
              {
                "name": "REDIS_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "hupo-chat-secrets",
                    "key": "REDIS_PASSWORD"
                  }
                }
              }
            ],
            "ports": [
              {
                "name": "redis",
                "containerPort": 6379
              }
            ],
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data"
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "512Mi"
              }
            },
            "command": [
              "sh",
              "-ec"
            ],
            "args": [
              "umask 077; printf \"requirepass %s\\nappendonly yes\\nappendfsync everysec\\n\" \"$REDIS_PASSWORD\" > /tmp/redis.conf; exec redis-server /tmp/redis.conf"
            ],
            "startupProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-ec",
                  "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"
                ]
              },
              "timeoutSeconds": 5,
              "periodSeconds": 10,
              "failureThreshold": 30
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-ec",
                  "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"
                ]
              },
              "timeoutSeconds": 5,
              "periodSeconds": 10,
              "failureThreshold": 3
            },
            "livenessProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-ec",
                  "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"
                ]
              },
              "timeoutSeconds": 5,
              "periodSeconds": 10,
              "failureThreshold": 6
            }
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data",
          "annotations": {
            "argocd.argoproj.io/sync-options": "Delete=false"
          }
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "2Gi"
            }
          }
        }
      }
    ]
  }
}
