{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "hupo-chat-preflight-isolation",
    "namespace": "hupo-chat-preflight",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-10"
    }
  },
  "spec": {
    "podSelector": {},
    "policyTypes": [
      "Ingress",
      "Egress"
    ],
    "ingress": [
      {
        "from": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "kube-system"
              }
            },
            "podSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "traefik"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 8080
          }
        ]
      }
    ],
    "egress": [
      {
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "kube-system"
              }
            },
            "podSelector": {
              "matchLabels": {
                "k8s-app": "kube-dns"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "UDP",
            "port": 53
          },
          {
            "protocol": "TCP",
            "port": 53
          }
        ]
      },
      {
        "to": [
          {
            "ipBlock": {
              "cidr": "10.43.0.1/32"
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 443
          }
        ]
      },
      {
        "to": [
          {
            "ipBlock": {
              "cidr": "192.168.100.191/32"
            }
          },
          {
            "ipBlock": {
              "cidr": "192.168.100.229/32"
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 6443
          }
        ]
      },
      {
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "sealed-secrets"
              }
            },
            "podSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "sealed-secrets",
                "app.kubernetes.io/instance": "sealed-secrets"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 8080
          }
        ]
      }
    ]
  }
}
