{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "hupo-chat-preflight",
    "namespace": "hupo-chat-preflight",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "0"
    }
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "hupo-chat-preflight"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "hupo-chat-preflight"
        }
      },
      "spec": {
        "nodeSelector": {
          "kubernetes.io/hostname": "node01"
        },
        "serviceAccountName": "hupo-chat-preflight",
        "automountServiceAccountToken": false,
        "enableServiceLinks": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "fsGroup": 1000,
          "fsGroupChangePolicy": "OnRootMismatch",
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "terminationGracePeriodSeconds": 15,
        "containers": [
          {
            "name": "preflight",
            "image": "node:24.22.2-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c",
            "imagePullPolicy": "IfNotPresent",
            "command": [
              "node",
              "--max-old-space-size=64",
              "/opt/preflight/server.mjs"
            ],
            "workingDir": "/opt/preflight",
            "env": [
              {
                "name": "NODE_NAME",
                "valueFrom": {
                  "fieldRef": {
                    "apiVersion": "v1",
                    "fieldPath": "spec.nodeName"
                  }
                }
              }
            ],
            "ports": [
              {
                "name": "http",
                "containerPort": 8080,
                "protocol": "TCP"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "100m",
                "memory": "128Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "source",
                "mountPath": "/opt/preflight",
                "readOnly": true
              },
              {
                "name": "api-access",
                "mountPath": "/var/run/secrets/kubernetes.io/serviceaccount",
                "readOnly": true
              },
              {
                "name": "probe-storage",
                "mountPath": "/probe-storage",
                "readOnly": true
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 8080
              },
              "periodSeconds": 5,
              "timeoutSeconds": 2,
              "failureThreshold": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 8080
              },
              "periodSeconds": 10,
              "timeoutSeconds": 2,
              "failureThreshold": 3
            }
          }
        ],
        "volumes": [
          {
            "name": "source",
            "configMap": {
              "name": "hupo-chat-preflight-source",
              "defaultMode": 292
            }
          },
          {
            "name": "api-access",
            "projected": {
              "defaultMode": 288,
              "sources": [
                {
                  "serviceAccountToken": {
                    "audience": "https://kubernetes.default.svc.cluster.local",
                    "expirationSeconds": 600,
                    "path": "token"
                  }
                },
                {
                  "configMap": {
                    "name": "kube-root-ca.crt",
                    "items": [
                      {
                        "key": "ca.crt",
                        "path": "ca.crt"
                      }
                    ]
                  }
                }
              ]
            }
          },
          {
            "name": "probe-storage",
            "persistentVolumeClaim": {
              "claimName": "hupo-chat-preflight-disk",
              "readOnly": true
            }
          }
        ]
      }
    }
  }
}
