{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "hupo-chat-preflight",
  "resources": [
    "namespace.yaml",
    "service-account.yaml",
    "rbac.yaml",
    "network-policy.yaml",
    "pvc.yaml",
    "deployment.yaml",
    "service.yaml"
  ],
  "configMapGenerator": [
    {
      "name": "hupo-chat-preflight-source",
      "files": [
        "plan.json",
        "runtime/resources.mjs",
        "runtime/capacity.mjs",
        "runtime/certificate.mjs",
        "runtime/snapshot.mjs",
        "runtime/upstream.mjs",
        "runtime/endpoint.mjs",
        "runtime/public-endpoint.mjs",
        "runtime/server.mjs"
      ]
    }
  ],
  "generatorOptions": {
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-10"
    }
  }
}
