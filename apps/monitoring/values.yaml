# kube-prometheus-stack values (merged from the former base + prod Flux HelmRelease)
#
# Note: neither Grafana nor Prometheus has persistent storage here - both use emptyDir,
# so dashboards/datasources come from the provisioning ConfigMaps and metrics history is
# lost on pod restart. That predates the Argo CD migration; enable
# grafana.persistence / prometheus.prometheusSpec.storageSpec if you want it to survive.
alertmanager:
  enabled: true

grafana:
  enabled: true
  # Use a sealed secret instead of letting the subchart generate admin-password with
  # randAlphaNum. Argo CD's repo-server renders without cluster access, so the chart's
  # `lookup` of the existing Secret always came up empty and produced a new password on
  # every render - permanently OutOfSync, and each sync would have rotated the Grafana
  # admin password and restarted the pod via the checksum/secret annotation. With
  # existingSecret set the chart renders neither the Secret nor that annotation.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
