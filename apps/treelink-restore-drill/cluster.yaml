---
# Restore drill: a scratch cluster recovered from the treelink-db object store.
# Not part of the production app; the Argo Application for it is added for a drill
# and removed afterwards (docs/BACKUPS.md in the treelink repo).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: treelink-db-drill-pitr
  namespace: treelink
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  storage:
    size: 2Gi
  bootstrap:
    recovery:
      source: treelink-db
      # Point-in-time recovery drill: the state just before a marker block was added.
      recoveryTarget:
        targetTime: "2026-09-25 19:11:52+00"
  externalClusters:
    - name: treelink-db
      barmanObjectStore:
        destinationPath: s3://treelink-db/
        endpointURL: http://rustfs.rustfs.svc.cluster.local:9000
        s3Credentials:
          accessKeyId:
            name: treelink-backup-s3
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: treelink-backup-s3
            key: ACCESS_SECRET_KEY
        wal:
          compression: gzip
