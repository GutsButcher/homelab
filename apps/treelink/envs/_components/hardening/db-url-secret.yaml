---
# PLACEHOLDER — not a real secret, do not apply as-is. Filled by the provisioning runbook after
# CNPG creates `treelink-db-app` for this cluster (host/user/password/dbname), then resealed as a
# real SealedSecret before anything reads it. See patch-web-db-url-env.yaml and
# apps/treelink/envs/README.md ("owner fills" table, row "sealed-secrets key for the new cluster").
apiVersion: v1
kind: Secret
metadata:
  name: treelink-db-url
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME" # postgres://<user>:<password>@<cnpg-rw-host>:5432/treelink?sslmode=require
