---
# PLACEHOLDER — not real secrets. See ../staging/media-secrets-placeholder.yaml. Suggested bucket
# name `treelink-media-production`; use a different object-storage key than staging's.
apiVersion: v1
kind: Secret
metadata:
  name: treelink-media-db
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: "REPLACE_ME"
  password: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: treelink-media-secrets
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME" # postgres://treelink_media:<password>@<cnpg-rw-host>:5432/treelink_media?sslmode=require
  S3_BUCKET: "REPLACE_ME" # suggested: treelink-media-production
  S3_ACCESS_KEY_ID: "REPLACE_ME"
  S3_SECRET_ACCESS_KEY: "REPLACE_ME"
  SERVICE_JWT_PUBLIC_KEY: "REPLACE_ME" # public half of a KEYPAIR GENERATED SEPARATELY from staging's
---
apiVersion: v1
kind: Secret
metadata:
  name: treelink-media-client
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
type: Opaque
stringData:
  MEDIA_SERVICE_PRIVATE_KEY: "REPLACE_ME"
