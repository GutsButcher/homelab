---
# PLACEHOLDER — not real secrets, do not apply as-is. See ../staging/secrets-placeholder.yaml for
# the full explanation; everything there applies here too. Use DIFFERENT values from staging for
# every key in this file — a shared SESSION_SECRET/ENCRYPTION_KEYS between staging and production
# means a staging compromise is a production compromise.
apiVersion: v1
kind: Secret
metadata:
  name: treelink-secrets
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
type: Opaque
stringData:
  SESSION_SECRET: "REPLACE_ME" # openssl rand -hex 32, generated fresh for this cluster
  ADMIN_EMAILS: "REPLACE_ME"
  ENCRYPTION_KEYS: "REPLACE_ME" # kid:base64-32-bytes[,kid2:...], generated fresh for this cluster
  MAIL_FROM: "REPLACE_ME"
  SMTP_URL: "REPLACE_ME"
  TURNSTILE_SITE_KEY: "REPLACE_ME"
  TURNSTILE_SECRET_KEY: "REPLACE_ME"
  WEB_RISK_API_KEY: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-registry
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: "REPLACE_ME"
