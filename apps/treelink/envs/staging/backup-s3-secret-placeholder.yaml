---
# PLACEHOLDER — not a real secret. Stands in for SealedSecret `treelink-backup-s3`
# (apps/treelink/base/treelink/backup-s3-secret.yaml), deleted by the hardening component for the
# same reason as secrets-placeholder.yaml. Scoped to read/write ONLY the staging database-backup
# bucket named in patch-cnpg.yaml (destinationPath) — never the production bucket's credential,
# and never RustFS's root credential the way the homelab's backup secret is today
# (docs/BACKUPS.md "Failure modes": "RustFS lost ... an off-site copy is a future improvement" —
# on real object storage there is no excuse to reuse a root key here).
apiVersion: v1
kind: Secret
metadata:
  name: treelink-backup-s3
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
type: Opaque
stringData:
  ACCESS_KEY_ID: "REPLACE_ME"
  ACCESS_SECRET_KEY: "REPLACE_ME"
