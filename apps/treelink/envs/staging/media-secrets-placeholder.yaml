---
# PLACEHOLDER — not real secrets. Stands in for the three SealedSecrets in
# apps/treelink/base/media/secrets.yaml, deleted by the hardening component. Same three
# objects, same keys; see that file for what each key is for.
#
# S3_BUCKET: the media service's object-storage bucket for this environment. Suggested name
# `treelink-media-staging` (TDR-0003 names it `treelink-media` generically; give staging and
# production their own bucket so a staging bug can never touch production media). Provision it
# with the "S3" owner-fill (../README.md) before filling this in.
apiVersion: v1
kind: Secret
metadata:
  name: treelink-media-db
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: "REPLACE_ME" # conventionally treelink_media, matching the CNPG managed role name
  password: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: treelink-media-secrets
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME" # postgres://treelink_media:<password>@<cnpg-rw-host>:5432/treelink_media?sslmode=require
  S3_BUCKET: "REPLACE_ME" # suggested: treelink-media-staging
  S3_ACCESS_KEY_ID: "REPLACE_ME" # bucket-scoped key, read/write/delete on this bucket only
  S3_SECRET_ACCESS_KEY: "REPLACE_ME"
  SERVICE_JWT_PUBLIC_KEY: "REPLACE_ME" # public half of an Ed25519 keypair generated for this cluster
---
apiVersion: v1
kind: Secret
metadata:
  name: treelink-media-client
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
type: Opaque
stringData:
  MEDIA_SERVICE_PRIVATE_KEY: "REPLACE_ME" # private half of the same Ed25519 keypair; web signs, media verifies
