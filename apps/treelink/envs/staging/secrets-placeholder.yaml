---
# PLACEHOLDER — not real secrets, do not apply as-is. Stands in for the dev tier's SealedSecret
# `treelink-secrets` (apps/treelink/base/treelink/secrets.yaml), which this overlay's hardening
# component deletes because it is ciphertext sealed against the homelab's controller key only.
#
# Before first deploy: write real values to a local env file (same shape as
# ~/.config/treelink/prod-secrets.env in the treelink repo, docs/DEPLOYMENT.md "Secrets"), run
# `kubeseal` against THIS cluster's sealed-secrets controller cert (owner fills: "sealed-secrets
# key for the new cluster" in ../README.md), and replace this file with the resulting SealedSecret
# — same name, same keys, `kind: SealedSecret`.
#
# Key sources: TURNSTILE_SITE_KEY/TURNSTILE_SECRET_KEY and WEB_RISK_API_KEY are REQUIRED BEFORE
# LAUNCH per docs/PRODUCTION-READINESS.md §1/§8 (Turnstile) and optional (Web Risk); SMTP_URL per
# the same table; ENCRYPTION_KEYS/SESSION_SECRET format: docs/SECURITY.md "Key material and
# rotation". Generate SESSION_SECRET/ENCRYPTION_KEYS fresh for this cluster — never copy the
# homelab's values (rotating SESSION_SECRET breaks TOTP seeds encrypted under the old one, so a
# fresh cluster should simply start with its own).
apiVersion: v1
kind: Secret
metadata:
  name: treelink-secrets
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
type: Opaque
stringData:
  SESSION_SECRET: "REPLACE_ME" # openssl rand -hex 32, generated fresh for this cluster
  ADMIN_EMAILS: "REPLACE_ME" # comma-separated; these addresses get the admin role at boot
  ENCRYPTION_KEYS: "REPLACE_ME" # kid:base64-32-bytes[,kid2:...], generated fresh for this cluster
  MAIL_FROM: "REPLACE_ME"
  SMTP_URL: "REPLACE_ME" # smtps://user:pass@host:465 — a real transactional provider, not MailHog
  TURNSTILE_SITE_KEY: "REPLACE_ME"
  TURNSTILE_SECRET_KEY: "REPLACE_ME"
  WEB_RISK_API_KEY: "REPLACE_ME" # optional: app runs without it (heuristics/blocklists only)
---
# Image pull credential. Keep using the Gitea registry, or point this at a different registry if
# that is the owner's D-16 choice — either way the key is `.dockerconfigjson`
# (type: kubernetes.io/dockerconfigjson), same as apps/treelink/base/treelink/secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: gitea-registry
  namespace: treelink
  labels:
    treelink.io/placeholder: "true"
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: "REPLACE_ME"
