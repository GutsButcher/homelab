---
# T-15/E4: a bucket-scoped credential for barman, replacing the RustFS ROOT credential
# (treelink-backup-s3, see backup-s3-secret.yaml) that cnpg.yaml used until this change.
#
# THE VALUES BELOW ARE LITERAL PLACEHOLDER TEXT, NOT A REAL CREDENTIAL. This is a genuinely
# sealed SealedSecret (kubeseal --cert <the live cluster's fetched public cert>, 2026-10-03), so
# it is valid to commit and apply as-is — but applying it as-is gives barman a key that cannot
# authenticate to RustFS, which fails backups (loudly: CNPG surfaces this in
# `status.conditions[type=ContinuousArchiving]` and the `TreelinkDbBackupFailed` /
# `TreelinkWalArchiveStale` alerts already wired in lgtm-alloy, docs/BACKUPS.md) — it does not
# take the application down; Postgres itself does not depend on this secret for anything but
# backup/WAL shipping.
#
# BEFORE MERGING, the owner must:
#   1. In RustFS, create a new access key scoped to read+write ONLY the treelink-db bucket (not
#      root). RustFS's admin surface was not inspected as part of this change (no RustFS
#      mutations were made or attempted); whatever RustFS calls its scoped-key /
#      bucket-policy mechanism, the target is: same permissions barman actually uses
#      (ListBucket, GetObject, PutObject, DeleteObject on s3://treelink-db/* only) and nothing
#      else — in particular, NOT the treelink-uploads or media buckets, and NOT RustFS's own
#      admin API.
#   2. Reseal this Secret with the real key pair:
#        kubectl create secret generic treelink-backup-s3-scoped -n treelink \
#          --dry-run=client -o yaml \
#          --from-literal=ACCESS_KEY_ID=<the new scoped key id> \
#          --from-literal=ACCESS_SECRET_KEY=<the new scoped secret> \
#        | kubeseal --cert <fetch-cert output> --format yaml > apps/treelink/base/treelink/backup-s3-scoped-secret.yaml
#      (scripts/seal-secrets.sh in the treelink repo cannot be used here: it is hardcoded to
#      the treelink-secrets document only, docs/DEPLOYMENT.md "Secrets" — this is a different
#      Secret, so there is no existing wrapper script for it; kubeseal by hand, as above, or a
#      small new treelink-repo script are the two options, and writing that script is out of
#      scope for this GitOps-only change.)
#   3. Commit the resealed file in place of this one, on top of this PR (or before merging it).
#
# Until step 2 happens, this file's placeholder values are what ships if the PR is merged as-is.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: treelink-backup-s3-scoped
  namespace: treelink
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    ACCESS_SECRET_KEY: 
  template:
    metadata:
      name: treelink-backup-s3-scoped
      namespace: treelink
