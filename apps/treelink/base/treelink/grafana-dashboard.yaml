# Grafana dashboard for Treelink, picked up by the dashboard sidecar in the monitoring
# namespace (label grafana_dashboard=1, same mechanism as the lgtm-dashboards app).
# Alert rules cannot be provisioned this way: the LGTM stack has no ruler/Alertmanager and
# the Grafana alert sidecar is off (decision pending, see treelink docs/DEPLOYMENT.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-treelink
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: treelink
data:
  treelink-overview.json: |
    {
      "uid": "treelink-overview",
      "title": "Treelink — overview",
      "description": "Request rate, errors, latency and Node.js runtime health for the production Treelink pod (OTel auto-instrumentation, job treelink/treelink). Integrations row: ADR-N application metrics through the OTel meter (docs/OBSERVABILITY.md).",
      "tags": [
        "treelink"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests / s by status",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "targets": [
            {
              "expr": "sum by (http_status_code) (rate(http_server_duration_milliseconds_count{job=\"treelink/treelink\"}[5m]))",
              "legendFormat": "{{http_status_code}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "5xx ratio",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_duration_milliseconds_count{job=\"treelink/treelink\",http_status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_duration_milliseconds_count{job=\"treelink/treelink\"}[5m])), 0.001)",
              "legendFormat": "5xx",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.01
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_server_duration_milliseconds_bucket{job=\"treelink/treelink\"}[5m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_duration_milliseconds_bucket{job=\"treelink/treelink\"}[5m])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_duration_milliseconds_bucket{job=\"treelink/treelink\"}[5m])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 500
                  },
                  {
                    "color": "red",
                    "value": 1500
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Event loop delay p99",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "targets": [
            {
              "expr": "nodejs_eventloop_delay_p99_seconds{job=\"treelink/treelink\"}",
              "legendFormat": "p99",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.1
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Heap used",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "targets": [
            {
              "expr": "v8js_memory_heap_used_bytes{job=\"treelink/treelink\"}",
              "legendFormat": "heap",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Instances reporting",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "targets": [
            {
              "expr": "count(target_info{job=\"treelink/treelink\"})",
              "legendFormat": "instances",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "type": "row",
          "title": "Integrations (ADR-N application metrics; docs/OBSERVABILITY.md)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Webhook attempts / s by result",
          "description": "Per-process counter summed across replicas.",
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (result) (rate(treelink_integration_attempts_total{job=\"treelink/treelink\"}[5m]))",
              "legendFormat": "{{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Webhook attempt latency p50 / p95",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 25,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(treelink_integration_attempt_duration_milliseconds_bucket{job=\"treelink/treelink\"}[5m])))",
              "legendFormat": "p50",
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              }
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(treelink_integration_attempt_duration_milliseconds_bucket{job=\"treelink/treelink\"}[5m])))",
              "legendFormat": "p95",
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Webhook queue depth by state (global, max across replicas)",
          "description": "Global database gauge: every replica reports the same value; never sum it.",
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (state) (treelink_integration_queue_depth{job=\"treelink/treelink\"})",
              "legendFormat": "{{state}}",
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              }
            },
            {
              "refId": "B",
              "expr": "max(treelink_integration_queue_due{job=\"treelink/treelink\"})",
              "legendFormat": "due now",
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Job heartbeat age (global, max across replicas)",
          "description": "Seconds since the job last ran on any replica, read from job_heartbeats (global gauge, max across replicas).",
          "gridPos": {
            "x": 12,
            "y": 33,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (job_name) (treelink_jobs_heartbeat_age_seconds{job=\"treelink/treelink\"})",
              "legendFormat": "{{job_name}}",
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              }
            }
          ]
        }
      ]
    }
