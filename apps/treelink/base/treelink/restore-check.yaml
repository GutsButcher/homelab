---
# Wave 3 W3-7 (T-08 remainder): turn the manual/by-hand quarterly restore drill
# (treelink docs/BACKUPS.md "Automated drills", scripts/infra/restore-drill.sh) into a
# WEEKLY, unattended, self-verifying, self-cleaning in-cluster CronJob.
#
# PROPOSAL ONLY. SUSPENDED BY DEFAULT (suspend: true below) and must stay that way until the
# owner gives an explicit go: treelink docs/BACKUPS.md's "Scheduling" subsection already states
# that turning a drill into a CronJob "needs the owner's go per change (D-11)" — this PR is that
# proposal, not the go-ahead. Do not flip suspend to false in this PR or any follow-up without
# that sign-off recorded (see the PR description's owner questions).
#
# Relationship to existing drafts/scripts (read before assuming this duplicates something):
#   - scripts/infra/restore-drill.sh (treelink repo) is the existing, hand-run, QUARTERLY drill.
#     It recovers to a FIXED PAST targetTime (default: now - 10 minutes) and only checks row
#     counts (users, pages, blocks, events). This CronJob is a different, complementary cadence
#     (weekly, unattended) with STRONGER verification (below) — it does not replace that script,
#     which the owner can still run by hand any time for an ad-hoc PITR check at an arbitrary
#     point in time.
#   - The unmerged, un-pushed local branch `security/t15-backup-hardening` already contains a
#     differently-named, nightly `restore-drill.yaml` (ServiceAccount/Role/RoleBinding/CronJob
#     `treelink-restore-drill`, drill cluster `treelink-db-drill`) bundled with D-11-gated
#     scoped-credential/encryption/offsite-backup changes that are explicitly out of Wave 3. This
#     file is a FRESH design branched off main (not off that branch), with deliberately distinct
#     resource names (treelink-restore-check / treelink-db-restore-check, never
#     treelink-restore-drill / treelink-db-drill) so the two can never collide if both exist
#     briefly. It upgrades that draft's verification in three ways:
#       1. Checks drizzle.__drizzle_migrations' row count against the live snapshot (strict
#          equality — a mismatch is schema drift between what was backed up and what the drill
#          replayed, always a finding, never "expected drift").
#       2. Checks WAL freshness on the RESTORED cluster itself via job_heartbeats: the drill
#          queries `extract(epoch from (now() - max(last_run_at)))` from job_heartbeats on the
#          drill cluster; if that's more than 900s (15 minutes — background jobs heartbeat far
#          more often than that in normal operation), WAL replay stopped well short of "now" even
#          though recovery reported healthy, which the row-count check alone would miss.
#       3. Omits recoveryTarget entirely to recover to the LATEST available WAL rather than a
#          fixed past point — every existing drill (the manual script and the t15 draft) only
#          ever exercises point-in-time recovery to a point safely in the past. This is NEW,
#          previously-untested recovery behaviour for this cluster; the PR description asks the
#          owner (or an agent they direct) to prove it once by hand before trusting the
#          unattended weekly schedule.
#     This PR's description recommends the owner drop t15's restore-drill.yaml from T-15 in
#     favour of this one once this lands, rather than maintaining two overlapping CronJobs.
#
# Credential: reuses the existing SealedSecret `treelink-backup-s3` (the same read-write
# credential the daily base backup, WAL archiving and the existing manual drill already use) —
# NOT a new, bucket-scoped, read-only key. apps/rustfs/RUSTFS-GUIDE.md documents exactly one
# RustFS credential mechanism: a single root access/secret key pair set via the Deployment's env
# vars (RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY). There is no IAM/policy/scoped-key feature
# documented or otherwise in evidence for the RustFS version deployed in this cluster, so a
# dedicated read-only bucket credential — the preferred design per the Wave 3 orchestrator — is
# not achievable today without either (a) running a second RustFS tenant/bucket with its own root
# key (a much bigger change, not attempted here) or (b) RustFS itself growing a scoped-credential
# feature. This PR takes the documented fallback instead: reuse `treelink-backup-s3`, exactly the
# exposure the daily production backup and the existing manual drill already accept (not a new
# regression), and flags true scoping as a RustFS capability gap for the owner to size, not
# something this PR invents a workaround for. See the PR description for the exact question.
#
# Node placement: PROPOSED at node01 (nodeSelector below), matching every other node-pinned
# workload in this namespace (uploads-backup implicitly via the RWO PVC's node affinity, and the
# media service's Deployment/Jobs explicitly via `kubernetes.io/hostname: node01` —
# apps/treelink/base/media/deployment.yaml and jobs/*.yaml). This is a proposal, not a decision:
# node01 is documented (docs/ENGINEERING-LOG.md, 2026-09-27) at 81% real memory allocation and a
# saturated NVMe, and the control-plane node (which runs the production treelink-db this drill
# reads backups from) has its own separate NVMe-stall history. The owner should confirm this
# placement (or steer it elsewhere) before un-suspending; see the PR description.
#
# Resource footprint: explicit requests/limits on BOTH the orchestrator pod (this CronJob's own
# container) and the ephemeral drill Cluster's Postgres instance (in the inline manifest below) —
# unlike today's production cnpg.yaml and the existing drill templates/drafts, which set no
# resources on the Postgres instance at all. Bounded further by activeDeadlineSeconds (30 min),
# a weekly (not nightly) cadence, and startingDeadlineSeconds so a missed schedule window doesn't
# silently queue up runs.
#
# No pods/exec on the live primary (review fix, 2026-10-04): the first draft ran row-count
# queries with `kubectl exec treelink-db-1 -- psql -U postgres`, which needed `pods/exec create`
# on the live primary's own pod — RBAC can scope *which pod* a token may exec into, but not
# *which command* it runs once inside, so a leaked token for this ServiceAccount would have had
# the practical equivalent of `psql -U postgres` superuser read/write on the production database.
# This design reads BOTH the live snapshot and the drill snapshot over the network instead, as
# the unprivileged app role, through the CNPG-generated Service + Secret already used by the web
# tier (apps/treelink/base/treelink/deployment.yaml: DATABASE_URL from Secret/treelink-db-app key
# `uri`) — never through exec, never as postgres. Concretely, the Pod below has two containers:
#   - `restore-check` (bitnamilegacy/kubectl, the ServiceAccount's RBAC subject): all Cluster
#     lifecycle (health checks, apply/delete the drill Cluster, wait-for-healthy). It never runs
#     psql and never needs pods/pods-exec permissions at all — the Role below has neither.
#   - `psql-bridge`: a native Kubernetes *sidecar* container (`restartPolicy: Always` on an
#     initContainer — GA since Kubernetes 1.29; this cluster runs k3s v1.34.1, confirmed with the
#     read-only `kubectl version`) built from `postgres:17-alpine`, which always ships the psql
#     client. It holds the treelink-db-app credentials as env vars and answers queries the
#     `restore-check` container hands it over a shared `emptyDir` (a trivial file-based RPC: write
#     a request, touch a ready-flag, the sidecar runs psql and writes the response back). Native
#     sidecars are terminated automatically once the regular container exits, successfully or
#     not, so no extra shutdown signalling is needed.
# Credential-reuse assumption, stated explicitly (per review): CNPG's recovery bootstrap replays
# the backed-up PGDATA verbatim, so the "app" role's password *inside Postgres* on the drill
# cluster is whatever the backup captured — the SAME password already in Secret/treelink-db-app,
# not a freshly generated one. The script does not merely assume this: right after the drill
# Cluster reports healthy, it runs a `select 1` preflight against the drill's own `-rw` Service
# using those same credentials, and FAILS CLOSED with a message naming the credential assumption
# (not "the backup is bad") if that preflight does not return exactly `1`. Network reachability:
# no NetworkPolicy in this repo restricts ingress to the CNPG Cluster pods or their Services in
# namespace `treelink` — the only NetworkPolicy mentioning `treelink-db` is an egress rule on the
# media service (apps/treelink/base/media/networkpolicy.yaml), which does not restrict who may
# reach port 5432 — so absent an undeclared, cluster-only policy, this Job's pod can already reach
# `treelink-db-rw` and (once created) `treelink-db-restore-check-rw` on port 5432 without further
# changes. Secret/treelink-db-app's keys (`username`, `password`, `dbname`, plus the `uri` key
# already consumed by deployment.yaml) are CNPG's documented, non-configurable "app" Secret
# format, cross-checked here against that one already-consumed key — not independently
# re-confirmed against the live Secret itself (reading it was out of scope for this fix; see "Not
# verified" in the PR description).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: treelink-restore-check
  namespace: treelink
automountServiceAccountToken: true
---
# RBAC note (read before trusting this as "safe to run unattended"): Kubernetes RBAC has no
# "name starts with X" matching — `resourceNames` only matches exact, pre-existing names. Because
# this CronJob always uses the same fixed drill-cluster name (treelink-db-restore-check, no
# override), everything that CAN be scoped by resourceNames below IS scoped:
#   - get/watch on Cluster objects: only treelink-db (read-only health check) and
#     treelink-db-restore-check (the drill cluster itself). This role can never read, let alone
#     touch, any other Cluster in the namespace.
#   - delete on Cluster: only treelink-db-restore-check. treelink-db is NEVER deletable by this
#     role; no patch/update is granted because the script never patches anything.
#   - get/delete on the PVC: only treelink-db-restore-check-1 (CNPG's instance-1 PVC naming
#     convention for this drill cluster name).
# This Role grants NOTHING on pods, pods/exec or secrets (review fix, 2026-10-04): the first draft
# needed `get`+`pods/exec create` on `treelink-db-1` (the live primary's own pod) to run
# `psql -U postgres` row-count queries, which RBAC could scope by pod name but not by command —
# a leaked token would have had the practical equivalent of production superuser access. Row
# counts are now read over the network (treelink-db-rw / treelink-db-restore-check-rw Services)
# by the unprivileged app role, as the `psql-bridge` sidecar container, not as this ServiceAccount
# — see the file header for the two-container design. This Role is therefore exactly four rules,
# all on `clusters`/`persistentvolumeclaims`, nothing else:
# What is NOT scoped, because RBAC's `create` verb has no object to attach a resourceName to
# before it exists: `create` on Cluster objects is namespace-wide. A leaked token for this
# ServiceAccount could therefore create an arbitrarily-named Cluster (consuming storage, pulling
# whatever imageName it specifies) but could not read, modify, or delete anything beyond
# treelink-db-restore-check, nor touch treelink-db, nor exec into or read secrets from any pod.
# This residual gap is inherent to Kubernetes RBAC (the same gap the t15 draft documents for its
# own, differently-named role), not an oversight here; closing it fully would need an admission
# policy (Kyverno/OPA Gatekeeper, neither installed in this cluster) — out of scope for this
# proposal.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: treelink-restore-check
  namespace: treelink
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "watch"]
    resourceNames: ["treelink-db", "treelink-db-restore-check"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["create"] # cannot be resourceName-scoped; see the RBAC note above
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["delete"] # the script only ever get/watch/create/deletes Clusters
    resourceNames: ["treelink-db-restore-check"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "delete"]
    resourceNames: ["treelink-db-restore-check-1"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: treelink-restore-check
  namespace: treelink
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: treelink-restore-check
subjects:
  - kind: ServiceAccount
    name: treelink-restore-check
    namespace: treelink
---
# Image fix (review, 2026-10-04): `docker.io/bitnami/kubectl:1.34`, carried over unverified from
# the t15 draft, does not exist — Bitnami retired every numbered tag on the free-tier `bitnami/*`
# Docker Hub namespace (only `latest`/`latest-metadata` survive there now); the CronJob would sit
# in permanent ImagePullBackOff the first time it ran. Same break, same fix already live in this
# repo at apps/erp/base/erp/db-bootstrap.yaml:91-100: `bitnamilegacy/*` still publishes the
# numbered tags, ships a shell, and already runs as uid 1001. Verified live against the Docker
# Hub registry API (`GET /v2/repositories/bitnamilegacy/kubectl/tags/1.33`) on 2026-10-04: tag
# `1.33` exists (HTTP 200, last pushed 2025-07-20), and the digest below is that response's
# manifest-list digest, pinned so a future retag can't silently change what this Job pulls.
# NOT independently verified: that this image ships /bin/bash (the script uses `set -o pipefail`,
# so it needs bash, not only /bin/sh — the erp precedent only proves /bin/sh) and a non-root
# default uid, beyond the erp precedent's own comment — this host's rules forbid any
# image pull for validation. The owner or CI should confirm this once (e.g. by un-suspending
# briefly in a controlled way, or `kubectl create job --from=cronjob/treelink-restore-check`)
# before relying on the schedule. Same caveat for recovering to the latest WAL (see the big header
# comment above): prove that path once by hand first.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: treelink-restore-check
  namespace: treelink
spec:
  # Weekly, Sunday 03:20 UTC: clear of the existing nightly chain (02:10 db base backup, 02:40
  # uploads mirror, 02:55 media mirror) and distinct from any nightly drill cadence (the t15
  # draft's restore-drill.yaml runs at 03:15 *daily*) so the two can never execute concurrently
  # even if both existed at once.
  schedule: "20 3 * * 0"
  # D-11: the owner's explicit go-ahead is required before this ever runs, per docs/BACKUPS.md
  # "Scheduling" ("Turning either into a CronJob is a GitOps change to ~/homelab and needs the
  # owner's go per change (D-11)..."). This PR proposes the CronJob; it does not authorize it.
  # Nothing in this PR, or any follow-up by an agent, may flip this to false.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0 # a failed check should surface immediately, not retry and mask a flaky run
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: treelink-restore-check
        spec:
          restartPolicy: Never
          serviceAccountName: treelink-restore-check
          automountServiceAccountToken: true
          # PROPOSED node placement (see the header comment): matches the media service's own
          # node01 pinning. Not a hard requirement of the design — the owner may steer this
          # elsewhere.
          nodeSelector:
            kubernetes.io/hostname: node01
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          # Native sidecar (restartPolicy: Always on an initContainer, GA since Kubernetes 1.29;
          # this cluster's server is v1.34.1 — confirmed read-only with `kubectl version`). It
          # starts before `restore-check`, runs concurrently with it, and is terminated
          # automatically once `restore-check` exits — success or failure — with no extra
          # shutdown signalling needed. See the file header for why this exists (no pods/exec on
          # the live primary).
          initContainers:
            - name: psql-bridge
              image: postgres:17-alpine
              restartPolicy: Always
              env:
                - name: HOME
                  value: /tmp
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: treelink-db-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: treelink-db-app
                      key: password
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: treelink-db-app
                      key: dbname
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  trap 'echo "psql-bridge: terminating"; exit 0' TERM
                  echo "psql-bridge: ready (PGUSER=$PGUSER PGDATABASE=$PGDATABASE)"
                  while true; do
                    if [ -f /shared/request.ready ]; then
                      req_host="$(cat /shared/request.host 2>/dev/null || true)"
                      req_sql="$(cat /shared/request.sql 2>/dev/null || true)"
                      rm -f /shared/request.ready
                      if out="$(psql -h "$req_host" -p 5432 -tAc "$req_sql" 2>&1)"; then
                        rc=0
                      else
                        rc=1
                      fi
                      printf '%s' "$out" > /shared/response.out
                      printf '%s' "$rc" > /shared/response.rc
                      touch /shared/response.ready
                    fi
                    sleep 1
                  done
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: shared
                  mountPath: /shared
                - name: psql-bridge-tmp
                  mountPath: /tmp
          containers:
            - name: restore-check
              image: docker.io/bitnamilegacy/kubectl:1.33@sha256:cd354d5b25562b195b277125439c23e4046902d7f1abc0dc3c75aad04d298c17
              command: ["/bin/bash", "-c"]
              env:
                - name: HOME
                  value: /tmp
              args:
                - |
                  set -euo pipefail
                  ns=treelink
                  name=treelink-db-restore-check
                  echo "restore check (weekly CronJob) start: name=$name host=$(uname -n)"

                  # RPC to the psql-bridge sidecar over a shared emptyDir (see the file header):
                  # this container has no psql client and no RBAC to exec into any pod. Every
                  # row-count/heartbeat/preflight query goes through here, never through exec.
                  q() {
                    host="$1"; sql="$2"
                    rm -f /shared/response.ready /shared/response.rc /shared/response.out
                    printf '%s' "$host" > /shared/request.host
                    printf '%s' "$sql" > /shared/request.sql
                    touch /shared/request.ready
                    waited=0
                    while [ ! -f /shared/response.ready ]; do
                      sleep 1
                      waited=$((waited + 1))
                      if [ "$waited" -gt 30 ]; then
                        echo "ERRORbridgetimeout"
                        return 0
                      fi
                    done
                    rc="$(cat /shared/response.rc 2>/dev/null || echo 1)"
                    out="$(cat /shared/response.out 2>/dev/null || true)"
                    if [ "$rc" = "0" ]; then
                      printf '%s' "$out" | tr -d '[:space:]'
                    else
                      printf 'ERROR%s' "$out" | tr -d '[:space:]'
                    fi
                  }
                  is_int() { case "$1" in ''|*[!0-9]*) return 1;; *) return 0;; esac; }

                  kubectl -n "$ns" get cluster treelink-db >/dev/null
                  prod_phase="$(kubectl -n "$ns" get cluster treelink-db -o jsonpath='{.status.phase}')"
                  if [ "$prod_phase" != "Cluster in healthy state" ]; then
                    echo "restore check RESULT: FAIL (production cluster treelink-db is not healthy: phase '$prod_phase'; a drill against a store whose producer is unhealthy proves nothing)"
                    exit 1
                  fi
                  echo "preflight: production treelink-db is healthy"

                  if kubectl -n "$ns" get cluster "$name" >/dev/null 2>&1; then
                    echo "restore check RESULT: FAIL (a Cluster named '$name' already exists; a previous run may not have cleaned up, or one is running concurrently)"
                    exit 1
                  fi

                  # Live snapshot, read over the network from the live primary's own -rw Service
                  # (treelink-db-rw) as the unprivileged app role — never pods/exec, never
                  # postgres superuser; see the file header. Captured BEFORE anything is created.
                  # Fail-closed: any query error here aborts before a drill cluster is even
                  # applied — there is no point testing a restore against a baseline we could not
                  # actually read.
                  live_users="$(q treelink-db-rw 'select count(*) from users')"
                  live_pages="$(q treelink-db-rw 'select count(*) from pages')"
                  live_blocks="$(q treelink-db-rw 'select count(*) from blocks')"
                  live_migrations="$(q treelink-db-rw 'select count(*) from drizzle.__drizzle_migrations')"
                  for v in "$live_users" "$live_pages" "$live_blocks" "$live_migrations"; do
                    if ! is_int "$v"; then
                      echo "restore check RESULT: FAIL (could not read a live snapshot value, got '$v'; refusing to start a drill with no baseline)"
                      exit 1
                    fi
                  done
                  echo "live snapshot: users=$live_users pages=$live_pages blocks=$live_blocks migrations=$live_migrations"

                  # Re-asserted inside cleanup() itself (belt-and-suspenders): the live
                  # treelink-db cluster and its PVCs are never named/labelled with this prefix, so
                  # this guard can never match them.
                  cleanup() {
                    case "$name" in
                      treelink-db-restore-check*) ;;
                      *) echo "cleanup: ABORT — '$name' does not start with 'treelink-db-restore-check'; refusing to delete anything"; return 1;;
                    esac
                    echo "cleanup: deleting Cluster/$name and PVC/${name}-1 (always runs: success, failure, or signal)"
                    kubectl -n "$ns" delete cluster "$name" --ignore-not-found --wait=false || true
                    # --wait=false here too: the Role grants get/delete on this one PVC by name but
                    # cannot grant list/watch (not resourceName-scoped), and `kubectl delete` without
                    # --wait=false watches the object until it is gone — first manual run
                    # (2026-10-04) PASSED the check but then hung in exactly that watch until the
                    # Job deadline. The delete call itself succeeds; confirm disappearance by polling
                    # the named get (allowed) for up to 2 minutes instead.
                    kubectl -n "$ns" delete pvc "${name}-1" --ignore-not-found --wait=false || true
                    for _ in $(seq 1 24); do
                      kubectl -n "$ns" get pvc "${name}-1" >/dev/null 2>&1 || { echo "cleanup: PVC/${name}-1 gone"; break; }
                      sleep 5
                    done
                  }
                  trap cleanup EXIT

                  cat <<YAML | kubectl apply -f -
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: $name
                    namespace: $ns
                    labels:
                      app.kubernetes.io/part-of: treelink-restore-check
                  spec:
                    instances: 1
                    imageName: ghcr.io/cloudnative-pg/postgresql:17.5
                    affinity:
                      nodeSelector:
                        kubernetes.io/hostname: node01
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
                    storage:
                      size: 2Gi
                    bootstrap:
                      recovery:
                        source: treelink-db-source
                        # recoveryTarget deliberately OMITTED: recover to the LATEST available
                        # WAL, not a fixed past targetTime. This is the one genuinely new recovery
                        # mode this proposal introduces (see the file header and the PR
                        # description's owner question about proving it once by hand first).
                    externalClusters:
                      - name: treelink-db-source
                        barmanObjectStore:
                          # serverName MUST be the live cluster's name: in an externalCluster
                          # CNPG defaults it to the alias above (treelink-db-source), while the
                          # live backup writes under its own Cluster name (treelink-db) — without
                          # this line the recovery looks in a catalog path that was never written
                          # to and the drill fails on every run (round-2 review of homelab #12).
                          serverName: treelink-db
                          destinationPath: s3://treelink-db/
                          endpointURL: http://rustfs.rustfs.svc.cluster.local:9000
                          s3Credentials:
                            accessKeyId:
                              name: treelink-backup-s3
                              key: ACCESS_KEY_ID
                            secretAccessKey:
                              name: treelink-backup-s3
                              key: ACCESS_SECRET_KEY
                          wal:
                            compression: gzip
                  YAML
                  echo "applied: Cluster/$name"

                  echo "waiting up to 1500s for Cluster/$name to report 'Cluster in healthy state'"
                  start=$(date +%s)
                  healthy=0
                  phase="unknown"
                  while [ $(( $(date +%s) - start )) -lt 1500 ]; do
                    phase="$(kubectl -n "$ns" get cluster "$name" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                    if [ "$phase" = "Cluster in healthy state" ]; then healthy=1; break; fi
                    sleep 5
                  done
                  rto=$(( $(date +%s) - start ))
                  if [ "$healthy" != 1 ]; then
                    echo "restore check RESULT: FAIL (drill cluster did not become healthy within ${rto}s; last phase: '$phase')"
                    exit 1
                  fi
                  echo "RTO: Cluster/$name reported healthy ${rto}s after apply"

                  drill_host="${name}-rw"
                  # Credential-reuse preflight (review fix, 2026-10-04 — see the file header for
                  # the full assumption): this job connects to the drill cluster with the SAME
                  # treelink-db-app credentials as the live primary, on the assumption that CNPG
                  # recovery replays the backed-up PGDATA (and so the app role's password inside
                  # Postgres) verbatim. Verify that assumption itself before trusting anything it
                  # reads: a plain `select 1` must come back as exactly "1".
                  drill_preflight="$(q "$drill_host" 'select 1')"
                  if [ "$drill_preflight" != "1" ]; then
                    echo "restore check RESULT: FAIL (could not authenticate to the drill cluster at $drill_host with the treelink-db-app credentials, got '$drill_preflight'; this breaks the assumption that CNPG recovery preserves the app role's password from the backup — see the file header. A credential/assumption failure, not evidence the backup itself is bad.)"
                    exit 1
                  fi

                  drill_users="$(q "$drill_host" 'select count(*) from users')"
                  drill_pages="$(q "$drill_host" 'select count(*) from pages')"
                  drill_blocks="$(q "$drill_host" 'select count(*) from blocks')"
                  drill_migrations="$(q "$drill_host" 'select count(*) from drizzle.__drizzle_migrations')"
                  # WAL-applied-freshness check: how long ago (on the DRILL cluster's own clock)
                  # the most recent background-job heartbeat was. Background jobs heartbeat far
                  # more often than 15 minutes in normal operation (src/lib/jobs.ts), so a value
                  # over 900s proves WAL replay stopped well short of "now" even if the Cluster
                  # object itself reports healthy — the row-count checks alone would not catch
                  # this (a frozen-early restore can still have plausible, non-zero row counts).
                  drill_heartbeat_age="$(q "$drill_host" 'select extract(epoch from (now() - max(last_run_at)))::bigint from job_heartbeats')"

                  echo "drill: users=$drill_users pages=$drill_pages blocks=$drill_blocks migrations=$drill_migrations heartbeat_age_s=$drill_heartbeat_age"

                  fail=0
                  findings=""
                  for pair in "users $live_users $drill_users" "pages $live_pages $drill_pages" "blocks $live_blocks $drill_blocks"; do
                    set -- $pair
                    table="$1"; l="$2"; d="$3"
                    if ! is_int "$d"; then
                      fail=1; findings="$findings ${table}:query-error"
                    elif [ "$d" -lt "$l" ]; then
                      fail=1; findings="$findings ${table}:drill($d)<live($l)"
                    fi
                  done

                  if ! is_int "$drill_migrations" || [ "$drill_migrations" != "$live_migrations" ]; then
                    fail=1; findings="$findings migrations:live($live_migrations)!=drill($drill_migrations)"
                  fi

                  if ! is_int "$drill_heartbeat_age" || [ "$drill_heartbeat_age" -gt 900 ]; then
                    fail=1; findings="$findings wal_staleness:${drill_heartbeat_age}s(>900s or unreadable)"
                  fi

                  result=PASS
                  [ "$fail" = 0 ] || result=FAIL
                  # Greppable result line (Job stdout is the only evidence this run produces: a
                  # CronJob cannot write docs/infra/baselines/*.log or commit to git, same
                  # limitation already documented for the t15 draft). Copy into
                  # docs/BACKUPS.md's "Drill record" table by hand if this run should be cited.
                  echo "restore check RESULT: $result (RTO ${rto}s; findings:${findings:- none})"
                  exit "$fail"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: shared
                  mountPath: /shared
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: psql-bridge-tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: shared
              emptyDir:
                sizeLimit: 16Mi
