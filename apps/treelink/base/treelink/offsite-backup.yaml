---
# T-15/E4: off-site copy of the backup bucket (docs/BACKUPS.md: "no off-site copy" is an open
# blocker in docs/PRODUCTION-READINESS.md §1 "Backup / PITR / DR"). Today both the database
# backup (RustFS, node01) and its only consumer live in this one homelab; losing the site loses
# both. This mirrors s3://treelink-db/ (the barman bucket) to a remote S3-compatible target, the
# same rclone bucket-to-bucket shape already used for apps/treelink/base/media/media-backup.yaml.
#
# Options considered (documented, not decided — this is the owner's call, D-11):
#   - Backblaze B2 (S3-compatible API): cheapest per-GB of the three, no egress fee for the first
#     3x stored volume per month, simplest to script with rclone (type=s3, provider=Other or a
#     native b2 remote). Recommended default below.
#   - Cloudflare R2: zero egress fee outright, S3-compatible; marginally more expensive to store
#     than B2 at this scale, and ties another credential to the Cloudflare account already
#     fronting treelink.gwynbliedd.com.
#   - A second physical site (e.g. a relative's hardware, or another on-prem box) running its own
#     RustFS/MinIO and reachable over a WireGuard tunnel: no recurring cost, but it is new
#     infrastructure to build and keep patched, not just a bucket to point rclone at — the
#     highest-effort option of the three.
# None of these has been provisioned. The CronJob below is wired for "a generic S3-compatible
# endpoint" and ships `suspend: true` with placeholder credentials (SealedSecret
# treelink-offsite-s3, ACCESS_KEY_ID/SECRET_ACCESS_KEY/ENDPOINT/BUCKET all literal placeholder
# text, sealed the same way as backup-s3-scoped-secret.yaml — see that file's header for the
# kubeseal command). Un-suspend only after: picking one option, provisioning the bucket, and
# resealing this Secret with real values.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: treelink-offsite-s3
  namespace: treelink
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    BUCKET: 
    ENDPOINT: 
    SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: treelink-offsite-s3
      namespace: treelink
---
# Suspended by default — the owner enables it only after picking an off-site provider above and
# resealing treelink-offsite-s3 with real values. Runs after the on-prem backup chain completes
# (02:10 base backup, 02:40 uploads, 02:55 media) so it mirrors a store that already has the
# night's data; "current" always means "what RustFS has", never a direct DB read, so this job
# never touches treelink-db or the app.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: treelink-db-offsite-backup
  namespace: treelink
spec:
  schedule: "10 3 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: treelink-db-offsite-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rclone
              image: docker.io/rclone/rclone:1.68
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  rclone sync s3:treelink-db offsite:"$OFFSITE_BUCKET" \
                    --checksum --stats-one-line --stats 0 -v
                  echo "offsite backup complete: $(rclone size offsite:"$OFFSITE_BUCKET" --json)"
              env:
                - name: RCLONE_CONFIG_S3_TYPE
                  value: s3
                - name: RCLONE_CONFIG_S3_PROVIDER
                  value: Minio
                - name: RCLONE_CONFIG_S3_ENDPOINT
                  value: http://rustfs.rustfs.svc.cluster.local:9000
                - name: RCLONE_CONFIG_S3_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: treelink-backup-s3-scoped
                      key: ACCESS_KEY_ID
                - name: RCLONE_CONFIG_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: treelink-backup-s3-scoped
                      key: ACCESS_SECRET_KEY
                # The off-site remote: generic S3-compatible (works for Backblaze B2's S3 API,
                # Cloudflare R2, or a second RustFS/MinIO) once ENDPOINT/BUCKET/keys are real.
                - name: RCLONE_CONFIG_OFFSITE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_OFFSITE_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_OFFSITE_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: treelink-offsite-s3
                      key: ENDPOINT
                - name: RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: treelink-offsite-s3
                      key: ACCESS_KEY_ID
                - name: RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: treelink-offsite-s3
                      key: SECRET_ACCESS_KEY
                - name: OFFSITE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: treelink-offsite-s3
                      key: BUCKET
                - name: RCLONE_CONFIG_DIR
                  value: /tmp/rclone
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: tmp
              emptyDir: {}
