---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: treelink
  namespace: treelink
  labels:
    app: treelink
spec:
  replicas: 1
  # The uploads PVC is RWO and the rate limiter is in-process: one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: treelink
  template:
    metadata:
      labels:
        app: treelink
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "nodejs" # named: two Instrumentation CRs live in the namespace since the media service (a bare "true" makes the operator refuse to pick one)
    spec:
      imagePullSecrets:
        - name: gitea-registry
      # The web tier never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: treelink
          # Tag is set in apps/treelink/prod/kustomization.yaml by scripts/release.sh
          # in the treelink repository.
          image: gitea.gwynbliedd.com/gwynbliedd/treelink:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: treelink-db-app
                  key: uri
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: SESSION_SECRET
            - name: ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: ADMIN_EMAILS
            # Email (verification, reset, security alerts). Both keys live in the
            # treelink-secrets SealedSecret; optional so the app boots without them
            # and logs emails instead of sending.
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: SMTP_URL
                  optional: true
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: MAIL_FROM
                  optional: true
            # Optional integrations; add the keys to treelink-secrets to enable.
            - name: TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: TURNSTILE_SITE_KEY
                  optional: true
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: TURNSTILE_SECRET_KEY
                  optional: true
            - name: WEB_RISK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: WEB_RISK_API_KEY
                  optional: true
            - name: APP_URL
              value: https://treelink.gwynbliedd.com
            # Field-encryption keyring (treelink docs/SECURITY.md § Key material and rotation):
            # separate from SESSION_SECRET; rotated by prepending a key and letting maintenance
            # re-encrypt. Optional so an image without the keyring still boots on the legacy key.
            - name: ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: ENCRYPTION_KEYS
                  optional: true
            # Media service (TDR-0003 Phase 1). The web tier signs short-lived service tokens with
            # this key; which path is used is decided by the platform flags media_dual_write /
            # media_service (admin → flags), both off by default, so setting these changes nothing
            # by itself. Removing them is the hard off switch.
            - name: MEDIA_SERVICE_URL
              value: http://treelink-media.treelink.svc.cluster.local:3100
            - name: MEDIA_SERVICE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: treelink-media-client
                  key: MEDIA_SERVICE_PRIVATE_KEY
                  optional: true
            - name: UPLOAD_DIR
              value: /data/uploads
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
            # Full restricted profile (E2 remainder): the standalone server's own image-
            # optimisation cache is next/dist/server/image-optimizer.js's cacheDir, which is
            # always `${distDir}/cache/images`; distDir defaults to `.next` and WORKDIR is /app
            # (Dockerfile), so the real path is /app/.next/cache, not a config choice. Everything
            # else under /app (server.js, .next/static, public, drizzle, src/assets) is baked into
            # the image and never written at runtime. /tmp is mounted too because Node itself (and
            # any transitive dependency) may use it (os.tmpdir()) even though no app code under
            # src/lib does today.
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          # Fully restricted profile: root filesystem is read-only; the only writable paths are
          # the uploads volume and the two emptyDirs above.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Probe convention (TDR-0003 Phase 0, template for every service incl. media-service):
          #   startup   /livez  process answers; covers boot-time migrations before liveness applies
          #   liveness  /livez  process-only, never touches PostgreSQL/Redis/RabbitMQ, so a dependency
          #                     outage can never restart the app in a loop
          #   readiness /readyz database + configured dependencies; failing it only removes the pod
          #                     from the Service (503 at the edge) until the dependency is back
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 36 # up to 3 min for the boot-time migrations
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: treelink-uploads
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
