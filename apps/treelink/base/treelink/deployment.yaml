---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: treelink
  namespace: treelink
  labels:
    app: treelink
spec:
  replicas: 1
  # The uploads PVC is RWO and the rate limiter is in-process: one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: treelink
  template:
    metadata:
      labels:
        app: treelink
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "nodejs" # named: two Instrumentation CRs live in the namespace since the media service (a bare "true" makes the operator refuse to pick one)
    spec:
      imagePullSecrets:
        - name: gitea-registry
      # The web tier never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: treelink
          # Tag is set in apps/treelink/prod/kustomization.yaml by scripts/release.sh
          # in the treelink repository.
          image: gitea.gwynbliedd.com/gwynbliedd/treelink:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # T-14/E3: force TLS on the database connection. CNPG already issues and auto-renews a
          # server certificate from its own internal CA for every Cluster (verified live,
          # 2026-10-03: Secret/treelink-db-ca, Secret/treelink-db-server exist and
          # Cluster/treelink-db's status.certificates lists both, expiring 2026-12-23, alongside
          # ssl_min/max_protocol_version: TLSv1.3 already set in spec.postgresql.parameters) — no
          # cert-manager involvement; infrastructure/cert-manager in this repo is unused
          # (its own README: "currently empty... reserved for future"). What was missing is the
          # CLIENT side: the `postgres` npm driver this app uses (node_modules/postgres) defaults
          # to `ssl: false` — no TLS attempt at all — unless the connection string's query string
          # sets `sslmode` (traced in node_modules/postgres/src/index.js and connection.js; this
          # is why the open finding says "DB connection without TLS" even though the server has
          # been TLS-capable all along). CNPG's generated treelink-db-app Secret's `uri` key is a
          # plain DSN with no query string, so DATABASE_URL is read here under a different name
          # and the command below appends `sslmode=require` before exec'ing the server — this
          # changes nothing in the treelink repository, only how this container is launched.
          # `exec` keeps node as PID 1 so NEXT_MANUAL_SIG_HANDLE's SIGTERM handling
          # (src/lib/bootstrap.ts) is unaffected.
          command: ["/bin/sh", "-c"]
          args:
            - |
              case "$DATABASE_URL_BASE" in
                *\?*) export DATABASE_URL="${DATABASE_URL_BASE}&sslmode=require" ;;
                *) export DATABASE_URL="${DATABASE_URL_BASE}?sslmode=require" ;;
              esac
              exec node server.js
          env:
            - name: DATABASE_URL_BASE
              valueFrom:
                secretKeyRef:
                  name: treelink-db-app
                  key: uri
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: SESSION_SECRET
            - name: ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: ADMIN_EMAILS
            # Email (verification, reset, security alerts). Both keys live in the
            # treelink-secrets SealedSecret; optional so the app boots without them
            # and logs emails instead of sending.
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: SMTP_URL
                  optional: true
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: MAIL_FROM
                  optional: true
            # Optional integrations; add the keys to treelink-secrets to enable.
            - name: TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: TURNSTILE_SITE_KEY
                  optional: true
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: TURNSTILE_SECRET_KEY
                  optional: true
            - name: WEB_RISK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: WEB_RISK_API_KEY
                  optional: true
            - name: APP_URL
              value: https://treelink.gwynbliedd.com
            # Field-encryption keyring (treelink docs/SECURITY.md § Key material and rotation):
            # separate from SESSION_SECRET; rotated by prepending a key and letting maintenance
            # re-encrypt. Optional so an image without the keyring still boots on the legacy key.
            - name: ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: treelink-secrets
                  key: ENCRYPTION_KEYS
                  optional: true
            # Media service (TDR-0003 Phase 1). The web tier signs short-lived service tokens with
            # this key; which path is used is decided by the platform flags media_dual_write /
            # media_service (admin → flags), both off by default, so setting these changes nothing
            # by itself. Removing them is the hard off switch.
            - name: MEDIA_SERVICE_URL
              value: http://treelink-media.treelink.svc.cluster.local:3100
            - name: MEDIA_SERVICE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: treelink-media-client
                  key: MEDIA_SERVICE_PRIVATE_KEY
                  optional: true
            - name: UPLOAD_DIR
              value: /data/uploads
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          # Restricted profile except the root filesystem: Next's standalone server writes its
          # image-optimisation cache under .next; the uploads volume is the only intended write path.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Probe convention (TDR-0003 Phase 0, template for every service incl. media-service):
          #   startup   /livez  process answers; covers boot-time migrations before liveness applies
          #   liveness  /livez  process-only, never touches PostgreSQL/Redis/RabbitMQ, so a dependency
          #                     outage can never restart the app in a loop
          #   readiness /readyz database + configured dependencies; failing it only removes the pod
          #                     from the Service (503 at the edge) until the dependency is back
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 36 # up to 3 min for the boot-time migrations
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: treelink-uploads
