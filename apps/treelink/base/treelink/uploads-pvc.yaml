---
# Avatars and covers, re-encoded to WebP by the app. ReadWriteOnce on local-path,
# which is why the Deployment runs a single replica with a Recreate strategy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: treelink-uploads
  annotations:
    # Keep data when the Application is deleted/disabled (see argocd/README.md).
    argocd.argoproj.io/sync-options: Delete=false
  namespace: treelink
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
