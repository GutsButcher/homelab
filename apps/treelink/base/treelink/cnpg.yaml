---
# CloudNativePG cluster for Treelink. CNPG creates Secret/treelink-db-app with a
# ready-made `uri` key, which the Deployment reads as DATABASE_URL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: treelink-db
  namespace: treelink
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
  bootstrap:
    initdb:
      database: treelink
      owner: treelink
  # Roles of the services that own their own database in this cluster (TDR-0003: database per
  # service). The media service's database is declared in ../media/database.yaml.
  managed:
    roles:
      - name: treelink_media
        ensure: present
        login: true
        # Declared explicitly: CNPG 1.26 defaults these two fields on the stored role and
        # spec.managed.roles is a whole-list field, so Argo CD compared git != live forever
        # (OutOfSync + a self-heal re-apply every ~5 min). Same values as live → applying is a no-op.
        connectionLimit: -1
        inherit: true
        comment: media service (TDR-0003 Phase 1)
        passwordSecret:
          name: treelink-media-db
  storage:
    size: 5Gi
  # On-prem backups: base backups + WAL archive in RustFS (apps/rustfs, node01),
  # 14 days of point-in-time recovery. Procedure and restore drill: docs/BACKUPS.md in the
  # treelink repo.
  #
  # T-15/E4: credentials are the bucket-scoped treelink-backup-s3-scoped (see
  # backup-s3-scoped-secret.yaml for what "scoped" means and the pre-merge step that makes it
  # real), replacing treelink-backup-s3 — which is RustFS's own ROOT credential
  # (docs/BACKUPS.md: "the same key pair is RustFS's root credential"), i.e. barman held
  # root-on-the-whole-object-store access to do nothing but read/write one bucket. The old
  # treelink-backup-s3 Secret (backup-s3-secret.yaml) is left in place and still used by
  # uploads-backup.yaml and media-backup.yaml (a different bucket, treelink-uploads) — scoping
  # those too is the same idea but was not asked for in this change and is not done here.
  #
  # `encryption: AES256` on both wal and data asks barman-cloud to send
  # `x-amz-server-side-encryption: AES256` on every object it writes (CNPG's barmanObjectStore
  # CRD field, not a new mechanism this PR invents). NOT independently verified here: whether
  # RustFS's S3 implementation actually honours that header and encrypts at rest, or silently
  # ignores it and stores plaintext anyway — RustFS was not queried or changed as part of this
  # PR. Confirm after merge with the owner's own knowledge of RustFS's SSE support before
  # treating "backups unencrypted" (docs/PRODUCTION-READINESS.md §3) as closed; if RustFS ignores
  # the header, this line is a no-op, not a regression, but also not the fix it looks like.
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://treelink-db/
      endpointURL: http://rustfs.rustfs.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: treelink-backup-s3-scoped
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: treelink-backup-s3-scoped
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        encryption: AES256
      data:
        compression: gzip
        jobs: 1
        encryption: AES256
