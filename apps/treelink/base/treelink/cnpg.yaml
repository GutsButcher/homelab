---
# CloudNativePG cluster for Treelink. CNPG creates Secret/treelink-db-app with a
# ready-made `uri` key, which the Deployment reads as DATABASE_URL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: treelink-db
  namespace: treelink
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
  bootstrap:
    initdb:
      database: treelink
      owner: treelink
  storage:
    size: 5Gi
  # On-prem backups: base backups + WAL archive in RustFS (apps/rustfs, node01),
  # 14 days of point-in-time recovery. Credentials: SealedSecret treelink-backup-s3.
  # Procedure and restore drill: docs/BACKUPS.md in the treelink repo.
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://treelink-db/
      endpointURL: http://rustfs.rustfs.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: treelink-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: treelink-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
        jobs: 1
