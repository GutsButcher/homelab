---
# Sealed with the cluster's sealed-secrets controller key (kubeseal --fetch-cert).
# SESSION_SECRET signs sessions/visitor hashes; ADMIN_EMAILS get the admin role at boot.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: treelink-secrets
  namespace: treelink
spec:
  encryptedData:
    ADMIN_EMAILS: 
    SESSION_SECRET: 
  template:
    metadata:
      name: treelink-secrets
      namespace: treelink
---
# Pull credentials for the Gitea container registry (token scope: read:package).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gitea-registry
  namespace: treelink
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: gitea-registry
      namespace: treelink
    type: kubernetes.io/dockerconfigjson
