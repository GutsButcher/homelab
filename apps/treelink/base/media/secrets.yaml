# Sealed by treelink scripts/seal-media-secrets.sh (values: ~/.config/treelink/media-secrets.env,
# object-storage key: ~/.config/treelink/dev-s3.env). Never edited by hand.
---
# PostgreSQL role treelink_media (CNPG managed role, apps/treelink/base/treelink/cnpg.yaml).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: treelink-media-db
  namespace: treelink
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      labels:
        cnpg.io/reload: "true"
      name: treelink-media-db
      namespace: treelink
    type: kubernetes.io/basic-auth
---
# Media service: its database URL, the bucket-scoped object-storage key, the public token key.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: treelink-media-secrets
  namespace: treelink
spec:
  encryptedData:
    DATABASE_URL: 
    S3_ACCESS_KEY_ID: 
    S3_BUCKET: 
    S3_SECRET_ACCESS_KEY: 
    SERVICE_JWT_PUBLIC_KEY: 
  template:
    metadata:
      name: treelink-media-secrets
      namespace: treelink
---
# Web tier: the private half of the service token key (signs, never verifies).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: treelink-media-client
  namespace: treelink
spec:
  encryptedData:
    MEDIA_SERVICE_PRIVATE_KEY: 
  template:
    metadata:
      name: treelink-media-client
      namespace: treelink
